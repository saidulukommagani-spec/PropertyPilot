name: PropertyPilot Build

on:
  push:
    branches:
      - main
      - develop
      - phase1-database-foundation

  pull_request:
    branches:
      - main
      - develop
      - phase1-database-foundation

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: ./mvnw clean verify