spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/propertypilot}
    username: ${DB_USERNAME:propertypilot}
    password: ${DB_PASSWORD:propertypilot}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    show-sql: false

security:
  jwt:
    secret: ${JWT_SECRET:PropertyPilotDevelopmentJwtSecretKeyMustBeAtLeast32CharactersLong}

logging:
  level:
    com.propertypilot: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
